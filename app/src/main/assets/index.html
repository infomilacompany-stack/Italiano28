</style></head><body><header><div class="topline"><div class="brand">Italiano 28</div><div class="icons"><span>🔥 <b id="streak">0</b></span><span>❤️ <b id="hearts">5</b></span><span>⭐ <b id="xp">0</b></span></div></div><div class="bar"><div id="progress" class="fill"></div></div></header><main class="wrap"><section id="home"><div class="hero"><h1>Tu italiano en 28 días 🇮🇹</h1><p>Habla, comprende y responde. Practica poco contenido, muchas veces y en situaciones reales.</p><div class="stats"><div class="stat"><b id="done">0/28</b><small>días</small></div><div class="stat"><b id="level">1</b><small>nivel</small></div><div class="stat"><b id="accuracy">0%</b><small>precisión</small></div></div><button class="btn primary" onclick="openDay(nextDay())">Continuar</button><button class="btn secondary" onclick="openReview()">🧠 Repaso inteligente</button></div><div id="weakBox"></div><div id="days"></div></section><section id="lesson" class="lesson"><button class="back" onclick="goHome()">← Volver al mapa</button><div id="lessonContent"></div></section></main><script>

const stage=i=>i<7?'Fundamentos':i<14?'Vida cotidiana':i<21?'Conversación':'Inmersión y fluidez';
let state=loadState(), current=0, q=0, mode='lesson', session={correct:0,total:0,skills:{comprension:0,vocabulario:0,gramatica:0,pronunciacion:0,respuesta:0,conversacion:0},errors:[]};
function defaultState(){return {done:[],xp:0,streak:0,lastStudy:'',hearts:5,heartDate:'',skills:{comprension:{c:0,t:0},vocabulario:{c:0,t:0},gramatica:{c:0,t:0},pronunciacion:{c:0,t:0},respuesta:{c:0,t:0},conversacion:{c:0,t:0}},weak:{},achievements:[]}}
function loadState(){try{let s=JSON.parse(localStorage.getItem('it28v2'));return Object.assign(defaultState(),s||{})}catch(e){return defaultState()}}
function save(){localStorage.setItem('it28v2',JSON.stringify(state));renderHome()}
function today(){let d=new Date();return d.toISOString().slice(0,10)}
function refreshDaily(){let t=today();if(state.heartDate!==t){state.hearts=5;state.heartDate=t}if(state.lastStudy){let a=new Date(state.lastStudy),b=new Date(t);let diff=Math.round((b-a)/86400000);if(diff>1)state.streak=0}}
function markStudy(){let t=today();if(state.lastStudy!==t){if(state.lastStudy){let a=new Date(state.lastStudy),b=new Date(t);let diff=Math.round((b-a)/86400000);state.streak=diff===1?state.streak+1:1}else state.streak=1;state.lastStudy=t}}
function totalStats(){let c=0,t=0;Object.values(state.skills).forEach(x=>{c+=x.c;t+=x.t});return {c,t,p:t?Math.round(c/t*100):0}}
function renderHome(){refreshDaily();let st=totalStats();document.getElementById('done').textContent=state.done.length+'/28';document.getElementById('xp').textContent=state.xp;document.getElementById('streak').textContent=state.streak;document.getElementById('hearts').textContent=state.hearts;document.getElementById('accuracy').textContent=st.p+'%';document.getElementById('level').textContent=Math.max(1,Math.floor(state.xp/100)+1);document.getElementById('progress').style.width=(state.done.length/28*100)+'%';let weak=Object.entries(state.weak).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,3);document.getElementById('weakBox').innerHTML=weak.length?`<div class="card review"><b>🧠 Tus puntos débiles</b><p class="small">La app detectó elementos que conviene repetir.</p><div class="chips">${weak.map(x=>`<span class="chip">${x[0]}</span>`).join('')}</div><button class="btn secondary" onclick="openReview()">Practicar ahora</button></div>`:'';let h='';days.forEach((d,i)=>{let lock=i>0&&!state.done.includes(i-1),ok=state.done.includes(i);h+=`<div class="day ${lock?'lock':''}" onclick="${lock?'':'openDay('+i+')'}"><div class="top"><b>Día ${i+1} · ${d[0]}</b><span class="pill">${ok?'✓ Completado':lock?'🔒':'+'+(i<7?20:25)+' XP'}</span></div><div class="small">${stage(i)} · ${d[3]}</div><div class="progressmini" style="margin-top:8px"><i style="width:${ok?100:lock?0:25}%"></i></div></div>`});document.getElementById('days').innerHTML=h}
function nextDay(){for(let i=0;i<28;i++)if(!state.done.includes(i))return i;return 27}
function openDay(i){refreshDaily();if(i>0&&!state.done.includes(i-1))return;current=i;mode='lesson';q=0;session={correct:0,total:0,skills:{comprension:0,vocabulario:0,gramatica:0,pronunciacion:0,respuesta:0,conversacion:0},errors:[]};document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';showExercise()}
function openReview(){let keys=Object.entries(state.weak).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);if(!keys.length){alert('Aún no hay debilidades detectadas. Completa una lección y vuelve aquí.');return}mode='review';q=0;current=0;session={correct:0,total:0,skills:{comprension:0,vocabulario:0,gramatica:0,pronunciacion:0,respuesta:0,conversacion:0},errors:[]};session.items=keys.map(x=>findItem(x[0])).filter(Boolean);document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';showReview()}
function findItem(key){for(let i=0;i<days.length;i++)for(let j=0;j<days[i][1].length;j++)if(key===keyOf(i,j))return {d:i,j:j};return null}
function keyOf(i,j){return 'D'+(i+1)+'-'+(j+1)+' '+days[i][1][j]}
function goHome(){document.getElementById('lesson').style.display='none';document.getElementById('home').style.display='block';renderHome()}
function speak(t){if(window.Android){alert('La app está enviando: '+t);Android.speak(t)}else if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';speechSynthesis.speak(u)}}
function showExercise(){let d=days[current],items=d[1].length; if(q===0)session.started=Date.now(); if(q<items)renderCore(q); else if(q===items)renderSpeak(); else if(q===items+1)renderConversation(); else finishDay()}
function renderCore(j){let d=days[current],x=d[1][j],m=d[2][j];let type=j%4;let html=`<div class="card"><div class="tag">Día ${current+1} · ${stage(current)}</div><h2>${d[0]}</h2><p class="small">Objetivo: ${d[3]}.</p></div>`;if(type===0)html+=`<div class="card"><div class="tag">Comprensión</div><div class="it">${x}</div><button class="btn secondary" onclick="speak(${JSON.stringify(x)})">🔊 Escuchar italiano</button><p class="meaning">¿Qué significa?</p>${choices(m,current,j).map((o,k)=>`<button class="opt" onclick="choose(this,${k},${o.ok},'vocabulario','${esc(x)}')">${o.text}</button>`).join('')}<div id="fb"></div></div>`;else if(type===1)html+=`<div class="card"><div class="tag">Recuperación activa</div><p class="meaning">¿Cómo dices en italiano?</p><p><b>${m}</b></p>${choices(m,current,j,true).map((o,k)=>`<button class="opt" onclick="choose(this,${k},${o.ok},'respuesta','${esc(x)}')">${o.text}</button>`).join('')}<div id="fb"></div></div>`;else if(type===2)html+=`<div class="card"><div class="tag">Gramática práctica</div><p>Observa la estructura:</p><div class="it">${x}</div><p class="small">No memorices la regla aislada. Escúchala, entiéndela y úsala.</p><button class="btn secondary" onclick="speak(${JSON.stringify(x)})">🔊 Escuchar</button><p><b>Elige la traducción natural:</b></p>${choices(m,current,j).map((o,k)=>`<button class="opt" onclick="choose(this,${k},${o.ok},'gramatica','${esc(x)}')">${o.text}</button>`).join('')}<div id="fb"></div></div>`;else html+=`<div class="card"><div class="tag">Oído</div><p>Escucha y selecciona lo que acabas de oír.</p><button class="btn dark" onclick="speak(${JSON.stringify(x)})">▶ Reproducir</button><div style="height:8px"></div>${choices(x,current,j,false,true).map((o,k)=>`<button class="opt" onclick="choose(this,${k},${o.ok},'comprension','${esc(x)}')">${o.text}</button>`).join('')}<div id="fb"></div></div>`;html+=nav();document.getElementById('lessonContent').innerHTML=html}
function choices(m,di,j,reverse=false,audio=false){let correct=reverse?days[di][1][j]:reverse?m:m;let arr=[];if(reverse){arr=[{text:days[di][1][j],ok:true},{text:days[di][1][(j+1)%days[di][1].length],ok:false},{text:days[di][1][(j+2)%days[di][1].length],ok:false}]}else{arr=[{text:m,ok:true},{text:days[di][2][(j+1)%days[di][2].length],ok:false},{text:days[di][2][(j+2)%days[di][2].length],ok:false}]};return shuffle(arr)}
function shuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(z=>z.x)}
function esc(s){return s.replace(/'/g,"\\'").replace(/\\/g,'\\\\')}
function choose(el,index,ok,skill,key){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);session.total++;state.skills[skill].t++;if(ok){el.classList.add('correct');session.correct++;session.skills[skill]++;state.skills[skill].c++;state.xp+=2;document.getElementById('fb').innerHTML='<div class="feedback good">¡Correcto! +2 XP</div>'}else{el.classList.add('wrong');let opts=[...document.querySelectorAll('.opt')];let right=opts.find(x=>x.textContent.trim()=== (days[current][2][q]||days[current][1][q]));if(right)right.classList.add('correct');state.hearts=Math.max(0,state.hearts-1);state.weak[key]=(state.weak[key]||0)+1;session.errors.push(key);document.getElementById('fb').innerHTML='<div class="feedback bad">Casi. Vamos a repetirlo más adelante.</div>'}save()}
function nav(){return `<div class="nav"><button class="btn primary" onclick="nextExercise()">Siguiente</button></div>`}
function nextExercise(){q++;showExercise()}
function renderSpeak(){let d=days[current],prompt=d[1][0];document.getElementById('lessonContent').innerHTML=`<div class="card"><div class="tag">Pronunciación</div><h2>Ahora habla tú 🎙️</h2><p>Di de forma natural:</p><div class="it">${prompt}</div><button class="btn secondary" onclick="speak(${JSON.stringify(prompt)})">🔊 Escuchar modelo</button><button class="btn mic" onclick="listen()">🎙️ Grabar mi respuesta</button><div id="speech" class="small" style="margin-top:10px"></div><button class="btn primary" onclick="scoreSpeech()">Continuar</button></div>`}
function listen(){if(window.Android){document.getElementById('speech').textContent='Escuchando…';Android.listen()}else document.getElementById('speech').textContent='El reconocimiento de voz está disponible en la app Android.'}
window.onSpeechResult=function(t){let el=document.getElementById('speech');el.textContent=t?'Has dicho: “'+t+'”':'No pude reconocer la frase. Inténtalo otra vez.';session.speech=t}
function scoreSpeech(){session.total++;state.skills.pronunciacion.t++;if(session.speech){session.correct++;session.skills.pronunciacion++;state.skills.pronunciacion.c++;state.xp+=4}else state.weak['pronunciación Día '+(current+1)]=(state.weak['pronunciación Día '+(current+1)]||0)+1;save();q++;showExercise()}
function renderConversation(){let d=days[current],prompt=d[1][Math.min(1,d[1].length-1)];document.getElementById('lessonContent').innerHTML=`<div class="card"><div class="tag">Conversación</div><h2>Mini conversación</h2><div class="dialogue other"><b>Persona:</b> ${prompt}</div><p>Responde en italiano con una frase sencilla. No busques perfección: intenta comunicarte.</p><input id="answer" class="input" placeholder="Escribe tu respuesta en italiano"><button class="btn mic" onclick="listen()">🎙️ Responder con voz</button><div id="speech" class="small"></div><button class="btn primary" onclick="submitConversation()">Responder y continuar</button></div>`}
function submitConversation(){let a=(document.getElementById('answer').value||session.speech||'').trim();session.total++;state.skills.conversacion.t++;if(a){session.correct++;session.skills.conversacion++;state.skills.conversacion.c++;state.xp+=5;document.getElementById('lessonContent').innerHTML+=`<div class="card"><div class="feedback good">Bien. Produjiste una respuesta. En una conversación real, la comunicación importa primero.</div><button class="btn primary" onclick="finishDay()">Ver evaluación</button></div>`}else{state.weak['conversación Día '+(current+1)]=(state.weak['conversación Día '+(current+1)]||0)+1;document.getElementById('lessonContent').innerHTML+=`<div class="card"><div class="feedback warn">Intenta producir al menos una frase. La próxima vez tendrás otra oportunidad.</div><button class="btn primary" onclick="finishDay()">Ver evaluación</button></div>`}markStudy();save()}
function finishDay(){markStudy();let i=current;if(!state.done.includes(i)){state.done.push(i);state.xp+=i<7?10:15}let st=totalStats();let pct=session.total?Math.round(session.correct/session.total*100):0;unlockAchievement(i);save();document.getElementById('lessonContent').innerHTML=`<div class="card center"><div class="badge">🏆</div><h1>${i===27?'¡Evaluación final!':'Día '+(i+1)+' completado'}</h1><p>${i===27?'Has llegado a la evaluación integral de Italiano 28.':'Has practicado comprensión, recuperación activa, gramática, pronunciación y conversación.'}</p><div class="score"><div><b>${pct}%</b><br><small>sesión</small></div><div><b>+${i<7?10:15} XP</b><br><small>bono</small></div></div><h3>Tu progreso</h3><div class="score"><div>Comprensión<br><b>${skillPct('comprension')}%</b></div><div>Vocabulario<br><b>${skillPct('vocabulario')}%</b></div><div>Gramática<br><b>${skillPct('gramatica')}%</b></div><div>Pronunciación<br><b>${skillPct('pronunciacion')}%</b></div><div>Respuesta<br><b>${skillPct('respuesta')}%</b></div><div>Conversación<br><b>${skillPct('conversacion')}%</b></div></div><p class="small">${weakMessage()}</p><button class="btn primary" onclick="goHome()">Continuar</button></div>`}
function skillPct(k){let x=state.skills[k];return x.t?Math.round(x.c/x.t*100):0}
function weakMessage(){let w=session.errors.length;return w?`Detectamos ${w} elemento(s) para repasar. La app los priorizará en tu repaso inteligente.`:'Muy bien. No detectamos errores importantes en esta sesión.'}
function unlockAchievement(i){let a=state.achievements;if(i===0&&!a.includes('first'))a.push('first');if(i===6&&!a.includes('week1'))a.push('week1');if(i===13&&!a.includes('week2'))a.push('week2');if(i===20&&!a.includes('week3'))a.push('week3');if(i===27&&!a.includes('finish'))a.push('finish')}
function showReview(){let items=session.items;if(q>=items.length){document.getElementById('lessonContent').innerHTML=`<div class="card center"><h2>Repaso terminado 🧠</h2><p>Correctas: <b>${session.correct}/${session.total}</b></p><button class="btn primary" onclick="goHome()">Volver al mapa</button></div>`;return}let it=items[q],d=days[it.d],x=d[1][it.j],m=d[2][it.j];document.getElementById('lessonContent').innerHTML=`<div class="card"><div class="tag">Repaso inteligente</div><h2>${d[0]}</h2><div class="it">${x}</div><button class="btn secondary" onclick="speak(${JSON.stringify(x)})">🔊 Escuchar</button><p><b>${m}</b></p>${choices(m,it.d,it.j).map((o,k)=>`<button class="opt" onclick="reviewAnswer(this,${o.ok},'${esc(keyOf(it.d,it.j))}')">${o.text}</button>`).join('')}<div id="fb"></div></div>`}
function reviewAnswer(el,ok,key){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);session.total++;if(ok){el.classList.add('correct');session.correct++;state.weak[key]=Math.max(0,(state.weak[key]||0)-1);state.xp+=3;document.getElementById('fb').innerHTML='<div class="feedback good">¡Recuperado! Este elemento baja de prioridad.</div>'}else{el.classList.add('wrong');state.weak[key]=(state.weak[key]||0)+1;state.hearts=Math.max(0,state.hearts-1);document.getElementById('fb').innerHTML='<div class="feedback bad">Lo repetiremos de nuevo.</div>'}save();setTimeout(()=>{q++;showReview()},350)}
refreshDaily();renderHome();
</script></body></html>
